<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PrivateChat</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="PrivateChatApp.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">&#x2716;</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/webrtc-manager.js"></script>

    <script>
        // Diagnostics: catch JS errors and show them visibly
        window.addEventListener('error', function(e) {
            document.getElementById('app').innerHTML =
                '<pre style="color:red;padding:2rem;">JS Error: ' + e.message + '\n' + e.filename + ':' + e.lineno + '</pre>';
        });
        window.addEventListener('unhandledrejection', function(e) {
            document.getElementById('app').innerHTML =
                '<pre style="color:red;padding:2rem;">Unhandled rejection: ' + (e.reason?.message || e.reason) + '</pre>';
        });
    </script>

</body>

</html>
