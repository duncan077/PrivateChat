<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WebRTC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#181825;color:#cdd6f4;font-family:'Segoe UI',sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.video-grid{flex:1;display:flex;flex-wrap:wrap;gap:4px;padding:4px;align-content:flex-start;overflow-y:auto}
.video-cell{position:relative;background:#1e1e2e;border-radius:8px;overflow:hidden;min-width:200px;flex:1 1 300px;max-height:50vh}
.video-cell video{width:100%;height:100%;object-fit:cover;display:block}
.video-label{position:absolute;bottom:6px;left:8px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:4px}
</style>
</head>
<body>
<div class="video-grid" id="videoGrid">
  <div class="video-cell" id="localCell">
    <video id="localVideo" autoplay muted playsinline></video>
    <span class="video-label" id="localLabel">You</span>
  </div>
</div>
<script>
'use strict';

// ─── State ───────────────────────────────────────────────────────────────────

const state = {
  // Media
  localStream: null,
  screenStream: null,
  isMuted: false,
  isCameraOff: false,
  isScreenSharing: false,

  // Janus session (publisher)
  janusSessionId: 0,
  janusHandleId: 0,   // publisher handle only
  janusRoomId: 0,
  myPrivateId: 0,

  // Per-feed subscriber handles: feedId → { handleId, pc }
  feeds: {},

  // Publisher PeerConnection
  publisherPc: null,

  // Auth / server
  userId: '',
  roomId: '',
  serverBaseUrl: '',
  authToken: '',

  // Media constraints
  micDeviceId: '',
  cameraDeviceId: '',
  resolution: '1280x720',
  fps: '30',

  // ICE
  iceServers: [{ urls: 'stun:stun.l.google.com:19302' }],

  // Polling / keepalive
  polling: false,
  keepaliveTimer: null,
};

const videoGrid = document.getElementById('videoGrid');
const localVideo = document.getElementById('localVideo');

// ─── Helpers ─────────────────────────────────────────────────────────────────

function getResolution() {
  const [w, h] = (state.resolution || '1280x720').split('x').map(Number);
  return { width: w || 1280, height: h || 720 };
}

function getFps() {
  return parseInt(state.fps) || 30;
}

function postMsg(type, data) {
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage(JSON.stringify({ type, ...data }));
  }
}

async function apiPost(path, body) {
  const resp = await fetch(state.serverBaseUrl + path, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + state.authToken
    },
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    const text = await resp.text();
    throw new Error(`POST ${path} → ${resp.status}: ${text}`);
  }
  return resp.json();
}

async function apiGet(path) {
  const resp = await fetch(state.serverBaseUrl + path, {
    headers: { 'Authorization': 'Bearer ' + state.authToken }
  });
  if (!resp.ok) throw new Error(`GET ${path} → ${resp.status}`);
  return resp.json();
}

// ─── Media ───────────────────────────────────────────────────────────────────

async function startLocalStream() {
  try {
    if (state.localStream) {
      state.localStream.getTracks().forEach(t => t.stop());
    }
    const res = getResolution();
    const fps = getFps();
    const videoConstraint = {
      width:     { ideal: res.width },
      height:    { ideal: res.height },
      frameRate: { ideal: fps }
    };
    if (state.cameraDeviceId) videoConstraint.deviceId = { exact: state.cameraDeviceId };

    const audioConstraint = state.micDeviceId
      ? { deviceId: { exact: state.micDeviceId } }
      : true;

    state.localStream = await navigator.mediaDevices.getUserMedia({
      audio: audioConstraint,
      video: videoConstraint
    });
    localVideo.srcObject = state.localStream;

    // Re-apply mute / camera-off state.
    state.localStream.getAudioTracks().forEach(t => t.enabled = !state.isMuted);
    state.localStream.getVideoTracks().forEach(t => t.enabled = !state.isCameraOff);

    await enumerateAndReport();
    postMsg('streamReady', {});
  } catch (err) {
    postMsg('error', { message: 'Failed to access media: ' + err.message });
    throw err;
  }
}

async function enumerateAndReport() {
  try {
    // Trigger a permission prompt so labels are populated.
    try {
      const tmp = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
      tmp.getTracks().forEach(t => t.stop());
    } catch {}

    const devices = await navigator.mediaDevices.enumerateDevices();
    const microphones = devices
      .filter(d => d.kind === 'audioinput')
      .map(d => ({ deviceId: d.deviceId, label: d.label || 'Mic ' + d.deviceId.slice(0, 6) }));
    const cameras = devices
      .filter(d => d.kind === 'videoinput')
      .map(d => ({ deviceId: d.deviceId, label: d.label || 'Camera ' + d.deviceId.slice(0, 6) }));

    postMsg('devices', { microphones, cameras });
  } catch {}
}

// ─── Publisher ───────────────────────────────────────────────────────────────

async function publishOwnFeed() {
  const pc = new RTCPeerConnection({ iceServers: state.iceServers });
  state.publisherPc = pc;

  // Add local tracks.
  const stream = (state.isScreenSharing && state.screenStream) ? state.screenStream : state.localStream;
  if (stream) stream.getTracks().forEach(track => pc.addTrack(track, stream));
  // If screen-sharing, also add local audio.
  if (state.isScreenSharing && state.screenStream && state.localStream) {
    state.localStream.getAudioTracks().forEach(t => pc.addTrack(t, state.localStream));
  }

  // Collect trickle candidates.
  pc.onicecandidate = async ({ candidate }) => {
    try {
      await apiPost(
        `/api/janus/session/${state.janusSessionId}/handle/${state.janusHandleId}/trickle`,
        candidate   // null signals end-of-candidates
      );
    } catch {}
  };

  // Create offer and set local description.
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // Send joinandconfigure — the server waits for the real Janus event (not just ack).
  let joinResult;
  try {
    joinResult = await apiPost(
      `/api/janus/session/${state.janusSessionId}/handle/${state.janusHandleId}/message`,
      {
        body: {
          request: 'joinandconfigure',
          room:    state.janusRoomId,
          ptype:   'publisher',
          display: state.userId
        },
        jsep: { type: offer.type, sdp: offer.sdp }
      }
    );
  } catch (err) {
    postMsg('error', { message: 'Failed to join room: ' + err.message });
    return;
  }

  // Extract private_id and existing publishers.
  const pluginData = joinResult?.plugindata?.data;
  if (pluginData) {
    if (pluginData.private_id) state.myPrivateId = pluginData.private_id;
    if (Array.isArray(pluginData.publishers)) {
      for (const pub of pluginData.publishers) {
        await subscribeFeed(pub.id, pub.display);
      }
    }
  }

  // Apply the answer SDP from Janus.
  if (joinResult?.jsep) {
    await pc.setRemoteDescription(new RTCSessionDescription(joinResult.jsep));
  }

  postMsg('joined', {});
}

// ─── Subscriber (one handle per remote publisher) ────────────────────────────

async function subscribeFeed(feedId, display) {
  if (state.feeds[feedId]) return;   // already subscribed

  // Attach a DEDICATED handle for this subscriber — Janus requires this.
  let subHandleId;
  try {
    subHandleId = await attachHandle();
  } catch (err) {
    console.error('Failed to attach subscriber handle:', err);
    return;
  }

  // Join as subscriber — server polls until Janus sends the JSEP offer back.
  let subResult;
  try {
    subResult = await apiPost(
      `/api/janus/session/${state.janusSessionId}/handle/${subHandleId}/message`,
      {
        body: {
          request:    'join',
          room:       state.janusRoomId,
          ptype:      'subscriber',
          feed:       feedId,
          private_id: state.myPrivateId
        }
      }
    );
  } catch (err) {
    console.error('Subscriber join failed:', err);
    return;
  }

  if (!subResult?.jsep) {
    console.warn('No JSEP in subscriber join response — feed', feedId);
    return;
  }

  const subPc = new RTCPeerConnection({ iceServers: state.iceServers });
  state.feeds[feedId] = { handleId: subHandleId, pc: subPc };

  subPc.ontrack = ({ streams }) => {
    let cell = document.getElementById('remote-' + feedId);
    if (!cell) {
      cell = document.createElement('div');
      cell.className = 'video-cell';
      cell.id = 'remote-' + feedId;
      const vid = document.createElement('video');
      vid.autoplay = vid.playsInline = true;
      const lbl = document.createElement('span');
      lbl.className = 'video-label';
      lbl.textContent = display || ('User ' + feedId);
      cell.append(vid, lbl);
      videoGrid.appendChild(cell);
    }
    const vid = cell.querySelector('video');
    if (streams[0]) vid.srcObject = streams[0];
  };

  // Trickle ICE for this subscriber handle.
  subPc.onicecandidate = async ({ candidate }) => {
    try {
      await apiPost(
        `/api/janus/session/${state.janusSessionId}/handle/${subHandleId}/trickle`,
        candidate
      );
    } catch {}
  };

  // Set Janus's offer and create our answer.
  await subPc.setRemoteDescription(new RTCSessionDescription(subResult.jsep));
  const answer = await subPc.createAnswer();
  await subPc.setLocalDescription(answer);

  // Send "start" with our answer — server waits for the Janus event.
  try {
    await apiPost(
      `/api/janus/session/${state.janusSessionId}/handle/${subHandleId}/message`,
      {
        body: { request: 'start', room: state.janusRoomId },
        jsep: { type: answer.type, sdp: answer.sdp }
      }
    );
  } catch (err) {
    console.error('Subscriber start failed:', err);
  }
}

async function attachHandle() {
  // Ask the server to attach a new plugin handle and return its ID.
  // We reuse the same session; just POST to /api/janus/attach.
  const result = await apiPost(
    `/api/janus/session/${state.janusSessionId}/attach`,
    {}
  );
  // Server returns { handleId: <long> }
  if (result?.handleId) return result.handleId;
  throw new Error('attachHandle: unexpected response ' + JSON.stringify(result));
}

function removeFeed(feedId) {
  const feed = state.feeds[feedId];
  if (feed) {
    feed.pc.close();
    delete state.feeds[feedId];
  }
  document.getElementById('remote-' + feedId)?.remove();
}

// ─── Event polling loop ───────────────────────────────────────────────────────

async function startPolling() {
  state.polling = true;

  while (state.polling) {
    try {
      const event = await apiGet(`/api/janus/session/${state.janusSessionId}/poll`);
      if (!event || !state.polling) break;

      const type = event.janus;

      if (type === 'event') {
        const data = event?.plugindata?.data;
        if (data) {
          // New remote publisher(s) joined.
          if (Array.isArray(data.publishers)) {
            for (const pub of data.publishers) {
              await subscribeFeed(pub.id, pub.display);
            }
          }
          // Publisher left or unpublished.
          if (data.leaving)     removeFeed(data.leaving);
          if (data.unpublished && data.unpublished !== 'ok') removeFeed(data.unpublished);
        }

        // Re-negotiation JSEP on the publisher connection.
        if (event.jsep && state.publisherPc) {
          await state.publisherPc.setRemoteDescription(
            new RTCSessionDescription(event.jsep)
          );
        }
      }
    } catch {
      if (!state.polling) break;
      await sleep(1000);
    }
  }
}

// ─── Keepalive ────────────────────────────────────────────────────────────────

function startKeepalive() {
  // Janus default session timeout is 60s; ping every 30s.
  state.keepaliveTimer = setInterval(async () => {
    if (!state.polling) return;
    try {
      await apiPost(`/api/janus/session/${state.janusSessionId}/keepalive`, {});
    } catch {}
  }, 30_000);
}

function stopKeepalive() {
  if (state.keepaliveTimer) {
    clearInterval(state.keepaliveTimer);
    state.keepaliveTimer = null;
  }
}

// ─── Controls ────────────────────────────────────────────────────────────────

function toggleMute() {
  state.isMuted = !state.isMuted;
  state.localStream?.getAudioTracks().forEach(t => t.enabled = !state.isMuted);
  postMsg('muteChanged', { isMuted: state.isMuted });
}

function toggleCamera() {
  state.isCameraOff = !state.isCameraOff;
  state.localStream?.getVideoTracks().forEach(t => t.enabled = !state.isCameraOff);
  postMsg('cameraChanged', { isCameraOff: state.isCameraOff });
}

async function startScreenShare() {
  try {
    state.screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: { cursor: 'always' },
      audio: true
    });
    state.isScreenSharing = true;
    localVideo.srcObject = state.screenStream;
    state.screenStream.getVideoTracks()[0].onended = () => stopScreenShare();

    // Replace tracks in publisher PC.
    if (state.publisherPc) {
      const senders = state.publisherPc.getSenders();
      state.screenStream.getTracks().forEach(track => {
        const s = senders.find(x => x.track?.kind === track.kind);
        if (s) s.replaceTrack(track);
      });
    }
    postMsg('screenShareStarted', {});
  } catch (err) {
    postMsg('error', { message: 'Screen share failed: ' + err.message });
  }
}

function stopScreenShare() {
  state.screenStream?.getTracks().forEach(t => t.stop());
  state.screenStream = null;
  state.isScreenSharing = false;
  localVideo.srcObject = state.localStream;

  if (state.publisherPc && state.localStream) {
    const senders = state.publisherPc.getSenders();
    state.localStream.getTracks().forEach(track => {
      const s = senders.find(x => x.track?.kind === track.kind);
      if (s) s.replaceTrack(track);
    });
  }
  postMsg('screenShareStopped', {});
}

function stopAll() {
  state.polling = false;
  stopKeepalive();

  state.localStream?.getTracks().forEach(t => t.stop());
  state.localStream = null;
  state.screenStream?.getTracks().forEach(t => t.stop());
  state.screenStream = null;

  state.publisherPc?.close();
  state.publisherPc = null;

  Object.values(state.feeds).forEach(f => f.pc.close());
  state.feeds = {};

  localVideo.srcObject = null;
  document.querySelectorAll('.video-cell:not(#localCell)').forEach(el => el.remove());

  postMsg('stopped', {});
}

async function updateSettings(settings) {
  if (settings.micDeviceId    !== undefined) state.micDeviceId    = settings.micDeviceId;
  if (settings.cameraDeviceId !== undefined) state.cameraDeviceId = settings.cameraDeviceId;
  if (settings.resolution     !== undefined) state.resolution     = settings.resolution;
  if (settings.fps            !== undefined) state.fps            = settings.fps;

  await startLocalStream();

  if (state.publisherPc && state.localStream) {
    const senders = state.publisherPc.getSenders();
    const active = (state.isScreenSharing && state.screenStream) ? state.screenStream : state.localStream;
    active.getTracks().forEach(track => {
      const s = senders.find(x => x.track?.kind === track.kind);
      if (s) s.replaceTrack(track);
    });
  }
}

// ─── Utilities ───────────────────────────────────────────────────────────────

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// ─── WebView2 message bridge ──────────────────────────────────────────────────

if (window.chrome?.webview) {
  window.chrome.webview.addEventListener('message', async (e) => {
    const msg = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;

    switch (msg.type) {
      case 'init':
        state.userId         = msg.userId         || '';
        state.roomId         = msg.roomId         || '';
        state.janusSessionId = msg.janusSessionId || 0;
        state.janusHandleId  = msg.janusHandleId  || 0;
        state.janusRoomId    = msg.janusRoomId    || 0;
        state.serverBaseUrl  = msg.serverBaseUrl  || '';
        state.authToken      = msg.authToken      || '';
        state.micDeviceId    = msg.micDeviceId    || '';
        state.cameraDeviceId = msg.cameraDeviceId || '';
        state.resolution     = msg.resolution     || '1280x720';
        state.fps            = msg.fps            || '30';

        if (msg.iceServers) {
          try { state.iceServers = JSON.parse(msg.iceServers); } catch {}
        }

        try {
          await startLocalStream();
          await publishOwnFeed();
          startPolling();
          startKeepalive();
        } catch (err) {
          postMsg('error', { message: 'Init failed: ' + err.message });
        }
        break;

      case 'toggleMute':        toggleMute();        break;
      case 'toggleCamera':      toggleCamera();      break;
      case 'startScreenShare':  startScreenShare();  break;
      case 'stopScreenShare':   stopScreenShare();   break;
      case 'stop':              stopAll();            break;
      case 'enumerateDevices':  enumerateAndReport(); break;
      case 'updateSettings':    await updateSettings(msg); break;
    }
  });

  postMsg('ready', {});
}
</script>
</body>
</html>
