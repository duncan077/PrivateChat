[package]
name = "mediasoupb-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
tonic = "0.10"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
nuttcp = "0.6"
rustls = { version = "0.22", features = ["ring"] }
rustls-pemfile = "2.0"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", features = ["json"] }
tempfile = "3.9"
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
thiserror = "1.0"
omi = "0.2"

[lib]
name = "mediasoupb_backend"
path = "src/lib.rs"